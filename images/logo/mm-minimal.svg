<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif">
<style>@import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Jost:wght@400&amp;display=swap");</style>
  <circle cx="240" cy="240" r="212" fill="none" stroke="#e9ddc4" stroke-width="1.5"/>
  <circle cx="240" cy="240" r="202" fill="none" stroke="#c9973f" stroke-width="1"/>
  <g text-anchor="middle">
    <text x="172" y="298" font-size="182" font-weight="500" fill="#2a251e">M</text>
    <text x="308" y="298" font-size="182" font-weight="500" fill="#b96a45" fill-opacity="0.9">M</text>
    <text x="240" y="290" font-size="88" font-style="italic" font-weight="500" fill="#c9973f" stroke="#fffefc" stroke-width="5" paint-order="stroke">&amp;</text>
  </g>
  <!-- small sprig inside the top of the ring -->
  <g transform="translate(240 68)">
    <path d="M -24 0 Q 0 -11 24 0" fill="none" stroke="#8f7d4a" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="-15" cy="-4.2" rx="6.5" ry="2.6" fill="#a9814e" transform="rotate(-18 -15 -4.2)"/>
    <ellipse cx="15" cy="-4.2" rx="6.5" ry="2.6" fill="#c07a45" transform="rotate(18 15 -4.2)"/>
    <circle cx="0" cy="-8.5" r="2.8" fill="#b96a45"/>
  </g>
  <!-- date over the bottom of the ring -->
  <g transform="translate(240 446)">
    <rect x="-80" y="-16" width="160" height="30" fill="#fffefc"/>
    <text x="0" y="5" text-anchor="middle" font-size="19" letter-spacing="5" fill="#55492f" font-family="Jost, 'Avenir Next', sans-serif">21·12·2026</text>
  </g>
