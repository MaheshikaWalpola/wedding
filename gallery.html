<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Maheshika &amp; Moksha</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23a06b78'/%3E%3Ctext x='32' y='41' font-family='Georgia' font-size='24' fill='%23c7a763' text-anchor='middle'%3EM%26M%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header">
    <a class="monogram" href="index.html">M<span class="amp">&amp;</span>M</a>
    <button class="nav-toggle" aria-label="Menu">☰</button>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="info.html">Wedding Info</a>
      <a href="location.html">Location</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="seating.html">Find Your Seat</a>
      <a href="rsvp.html">RSVP</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="page">
    <div class="page-title">
      <p class="eyebrow">Our Moments</p>
      <h1>Photo Wall</h1>
      <p class="lede">
        Share your favourite snaps from the celebration — they'll appear
        right here for everyone to enjoy.
      </p>
    </div>

    <!-- Upload card: photos are resized in the browser, sent to the
         Apps Script backend, and stored in the couple's Google Drive. -->
    <section class="card form-card" style="margin-bottom: 2.5rem;">
      <form id="photo-form" novalidate>
        <label for="photo-name">Your Name <span style="text-transform:none;letter-spacing:0.05em;">(optional)</span></label>
        <input type="text" id="photo-name" name="name" placeholder="So we know who to thank!" autocomplete="name">

        <label for="photo-files">Choose Photos</label>
        <input type="file" id="photo-files" name="photos" accept="image/*" multiple>

        <div class="form-actions">
          <button type="submit" class="btn btn-solid">Share Photos</button>
        </div>
        <p id="photo-status" class="form-status"></p>
      </form>
    </section>

    <section class="gallery-grid" id="gallery-grid"></section>

    <div id="gallery-empty">
      <section class="gallery-grid">
        <figure class="gallery-tile">
          <div class="placeholder"><span class="mono">M&amp;M</span><span class="soon">Your photo here</span></div>
        </figure>
        <figure class="gallery-tile">
          <div class="placeholder"><span class="mono">M&amp;M</span><span class="soon">Your photo here</span></div>
        </figure>
        <figure class="gallery-tile">
          <div class="placeholder"><span class="mono">M&amp;M</span><span class="soon">Your photo here</span></div>
        </figure>
      </section>
      <p class="hint">No photos yet — be the first to share one! ✨</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="monogram">M<span class="amp">&amp;</span>M</div>
    <p>Maheshika &amp; Moksha · 21 December 2026</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
