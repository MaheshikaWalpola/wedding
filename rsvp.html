  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header">
    <a class="monogram" href="index.html">M<span class="amp">&amp;</span>M</a>
    <button class="nav-toggle" aria-label="Menu">☰</button>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="info.html">Wedding Info</a>
      <a href="location.html">Location</a>

      <a href="rsvp.html" class="active">RSVP</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="page">
    <div class="page-title">
      <p class="eyebrow">Kindly Respond</p>
      <h1>RSVP</h1>
      <p class="lede">
        Please reply by <strong>21 October 2026</strong> <!-- EDIT: RSVP deadline -->
        so we can save you the perfect seat.
      </p>
    </div>

    <section class="card form-card">
      <form id="rsvp-form" novalidate>
        <label for="rsvp-name">Your Name</label>
        <input type="text" id="rsvp-name" name="name" placeholder="Full name on your invitation" autocomplete="name">

        <label>Will you be joining us?</label>
        <div class="radio-row">
          <label><input type="radio" name="attending" value="yes"> Joyfully accept</label>
          <label><input type="radio" name="attending" value="no"> Regretfully decline</label>
        </div>

        <label for="rsvp-guests">Number of Guests (including you)</label>
        <select id="rsvp-guests" name="guests">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>

        <label for="rsvp-message">A Note for the Couple <span style="text-transform:none;letter-spacing:0.05em;">(optional)</span></label>
        <textarea id="rsvp-message" name="message" placeholder="Requests, well wishes, or anything else…"></textarea>

        <div class="form-actions">
          <button type="submit" class="btn btn-solid">Send RSVP</button>
        </div>
        <p id="rsvp-status" class="form-status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="monogram">M<span class="amp">&amp;</span>M</div>
    <p>Maheshika &amp; Moksha · 21 December 2026</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/rsvp.js"></script>
</body>
</html>
