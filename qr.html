<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photos QR · print me for the tables</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231c3fa0'/%3E%3Cpath d='M32 14l6 14 14 4-14 4-6 14-6-14-14-4 14-4z' fill='%23d4b978'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Printable table card: open this page and press Print (A5 or A6 works well).
       Not linked from the site on purpose. The QR code points at /gallery, which
       redirects to the photos page, so cards printed before the rebuild still work. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Manrope", sans-serif; background: #f2ebdc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; color: #1f1a14; }
    .qr-card { background: #fffdf8; border: 1px solid #e5d8b8; border-radius: 22px; padding: 3rem 2.6rem; text-align: center; max-width: 420px; box-shadow: 0 34px 80px rgba(31,26,20,.16); }
    .mono { font-family: "Playfair Display", serif; font-style: italic; font-size: 1.8rem; color: #1c3fa0; }
    .mono span { font-style: normal; color: #816421; }
    h1 { font-weight: 600; text-transform: uppercase; letter-spacing: .3em; font-size: .8rem; color: #816421; margin: .9rem 0 .4rem; }
    p.script { font-family: "Playfair Display", serif; font-style: italic; font-size: 1.15rem; color: #4f463c; margin-bottom: 1.6rem; }
    img.qr { width: 220px; height: 220px; margin: 0 auto; display: block; }
    p.url { margin-top: 1.2rem; font-size: .78rem; letter-spacing: .12em; color: #70675c; }
    .print-hint { margin-top: 2rem; font-size: .8rem; color: #70675c; }
    .print-hint button { font-family: inherit; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; font-size: .72rem; background: #1c3fa0; color: #fff; border: 0; border-radius: 999px; padding: .8rem 1.6rem; cursor: pointer; }
    @media print { body { background: #fff; padding: 0; } .qr-card { border: 0; box-shadow: none; } .print-hint { display: none; } }
  </style>
</head>
<body>
  <div class="qr-card">
    <div class="mono">M<span>&amp;</span>M</div>
    <h1>Share your photos</h1>
    <p class="script">scan to add your pictures of tonight<br>to our album</p>
    <img class="qr" src="images/qr-photowall.svg" alt="QR code to the photos page">
    <p class="url">maheshika-moksha.pages.dev/photos</p>
    <div class="print-hint">
      <button onclick="print()">Print this card</button>
      <p style="margin-top:.6rem;">A5 or A6 paper looks lovely on reception tables.</p>
    </div>
  </div>
</body>
</html>
